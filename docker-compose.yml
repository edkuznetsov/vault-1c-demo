name: vault-1c-demo

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
      APP_DB_NAME: demo_db
      APP_DB_USER: demo_user
      APP_DB_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init/01-create-demo-user.sh:/docker-entrypoint-initdb.d/01-create-demo-user.sh:ro
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 2s
      retries: 30

  vault:
    image: hashicorp/vault:2.1.0
    user: "0:0"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: ${VAULT_DEMO_ROOT_TOKEN:?Set VAULT_DEMO_ROOT_TOKEN}
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEMO_ROOT_TOKEN:?Set VAULT_DEMO_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      DEMO_POSTGRES_PASSWORD: ${DEMO_POSTGRES_PASSWORD:?Set DEMO_POSTGRES_PASSWORD}
    entrypoint: ["/bin/sh", "/config/start-vault.sh"]
    volumes:
      - ./vault:/config:ro
      - ./runtime/keys:/runtime/keys:ro
      - proxy-creds:/runtime/proxy
    ports:
      - "127.0.0.1:8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null 2>&1 && test -f /runtime/proxy/ready && test -s /runtime/proxy/role-id && test -s /runtime/proxy/secret-id"]
      interval: 2s
      timeout: 2s
      retries: 30

  proxy:
    image: hashicorp/vault:2.1.0
    depends_on:
      vault:
        condition: service_healthy
    command: ["proxy", "-config=/config/proxy.hcl"]
    volumes:
      - ./proxy:/config:ro
      - proxy-creds:/runtime/proxy:ro
    ports:
      - "127.0.0.1:8100:8100"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8100"]
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  postgres-data:
  proxy-creds:
